name: update

on:
  schedule:
    - cron: "7,37 * * * *"   # backup only: GitHub skips most of these (measured: ~1 run per 6 h); tick.yml is the real clock
  workflow_dispatch:
    inputs:
      poll:
        description: "Poll company boards: auto (boards that are due), yes (all now), no"
        default: auto
  push:
    branches: [main]

permissions:
  contents: write   # push the seen store to the `data` branch
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tests
        run: pip install -q pytest && python -m pytest -q

      - name: Restore seen store from the data branch
        run: |
          mkdir -p state
          # A failed fetch must never look like a first run: that would force-push an empty store over the real one.
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            for i in 1 2 3; do
              git fetch -q --depth 1 origin data && break
              echo "fetch of the data branch failed (try $i)"; sleep 10
            done
            git show origin/data:seen.json.gz > state/seen.json.gz || { echo "::error::could not read the seen store"; exit 1; }
          else
            code=$?
            if [ "$code" -ne 2 ]; then echo "::error::git ls-remote failed ($code)"; exit 1; fi
            echo "No data branch yet: first run, bootstrap mode."
          fi

      - name: Fetch the review agent's heartbeat (agent-status branch, pushed from Dheepak's laptop)
        run: |
          if git fetch -q --depth 1 origin agent-status; then
            git show origin/agent-status:status.json > state/agent-status.json || true
          else
            echo "No agent-status branch yet."
          fi

      - name: Build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # AI second reader; without it the rules decide alone
          RADAR_LLM_MODEL: ${{ vars.RADAR_LLM_MODEL }}
          RADAR_AI: "on"              # AI second reader on (Dheepak, 2026-11-14)
          RADAR_LLM_PROFILE: v1       # the setup measured on the held-out test set (95%, 0 not-eligible shown)
          RADAR_AI_REQUESTS: "15"     # per run; stops early when Groq's free daily token limit is reached
        run: python -m radar.build --state state/seen.json.gz --out site/data --poll "${{ inputs.poll || 'auto' }}" --agent-status state/agent-status.json

      - name: Save seen store (one orphan commit, force-pushed so the repo does not grow)
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          cp state/seen.json.gz site/data/jobs.json "$RUNNER_TEMP/data/"
          cd "$RUNNER_TEMP/data"
          git init -q -b data
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        continue-on-error: true   # Pages deploys fail now and then on GitHub's side: retry once below
        uses: actions/deploy-pages@v5
      - name: Wait before retrying the Pages deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
